<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Solgt · Klinten 2, Røsnæs</title>
<style>
  :root { --ink:#1f2a2e; --muted:#5d6b70; --bg:#f6f3ee; --accent:#2f5d62; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; }
  .hero { height:45vh; min-height:240px; background:url('/sommerhus/images/Klinten_2_Kalundborg-5.jpg') center/cover no-repeat; }
  main { flex:1; max-width:560px; margin:0 auto; padding:40px 16px 56px; text-align:center; }
  .badge { display:inline-block; background:var(--accent); color:#fff; font-family:system-ui, sans-serif;
           font-size:13px; letter-spacing:.12em; text-transform:uppercase; padding:6px 14px; border-radius:3px; }
  h1 { font-size:clamp(28px,6vw,40px); font-weight:normal; margin:18px 0 8px; }
  .addr { color:var(--muted); font-family:system-ui, sans-serif; font-size:15px; }
  p.lead { margin:28px 0; font-size:18px; line-height:1.6; }
  .contact { background:#fff; border-radius:6px; padding:24px 16px; font-family:system-ui, sans-serif; line-height:1.7; }
  .contact strong { display:block; font-size:17px; margin-bottom:4px; }
  .contact a.tel { display:inline-block; margin-top:12px; background:var(--accent); color:#fff; text-decoration:none;
                   padding:10px 22px; border-radius:4px; font-weight:600; }
</style>
</head>
<body>
  <div class="hero" role="img" aria-label="Terrasse ved Klinten 2"></div>
  <main>
    <span class="badge">Solgt</span>
    <h1>Sommerhuset på Røsnæs er solgt</h1>
    <div class="addr">Klinten 2, 4400 Kalundborg</div>
    <p class="lead">Tak for din interesse. Har du spørgsmål, eller søger du sommerhus i området, er du velkommen til at kontakte mægleren.</p>
    <div class="contact">
      <strong>Danbolig Kalundborg</strong>
      Strandstræde 1, 4400 Kalundborg<br>
      Åbent man–fre 9.00–17.00<br>
      <a class="tel" href="tel:59561600">59 56 16 00</a>
    </div>
  </main>
</body>
</html>
