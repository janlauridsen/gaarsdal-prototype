jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run A4 analysis
        run: |
          node scripts/analyze-cqc-logs.js > a4.json

      - name: Run A5 summary
        run: |
          node scripts/a5-summarize-cqc.js a4.json > a5-summary.json

      - name: Upload A4 + A5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cqc-analysis
          path: |
            a4.json
            a5-summary.json
